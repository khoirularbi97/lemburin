# Render Blueprint untuk backend lemburin.
# Render > New > Blueprint > pilih repo ini. Isi env yang bertanda sync:false.
services:
  - type: web
    name: lemburin-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: IZINKAN_WAKTU_SIMULASI
        value: "false"
      - key: JWT_KARYAWAN_EXPIRES_IN
        value: 30d
      - key: NAMA_PERUSAHAAN
        sync: false
      # Notifikasi Web Push. Buat dengan: cd server && npm run vapid
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Opsional: notifikasi aplikasi Android/iOS (Firebase)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Foto bukti SPL di Neon Object Storage (lihat README)
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: foto-spl
      - key: FOTO_SPL_SIMPAN_BULAN
        value: "13"
      # Pembaca SPL tulisan tangan (Azure AI Vision Read, tier gratis F0)
      - key: AZURE_VISION_ENDPOINT
        sync: false
      - key: AZURE_VISION_KEY
        sync: false
      - key: AZURE_VISION_BATAS_BULANAN
        value: "4500"
      # Pembaca SPL tulisan tangan (Gemini API berbayar; didahulukan dari Azure)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_BATAS_HARIAN
        value: "100"
