# Build aplikasi lemburin untuk Android, Windows, macOS, dan Linux.
#
# Jalan otomatis saat push tag versi (mis. v1.0.0) → tiap job langsung melampirkan
# hasilnya ke halaman Releases GitHub (tidak memakai kuota penyimpanan Artifacts).
# Bisa juga dijalankan manual dari tab Actions → "Build aplikasi" → Run workflow:
# hasilnya ada di bagian Artifacts dan otomatis terhapus setelah 3 hari, supaya
# kuota penyimpanan Actions (500 MB untuk repo privat akun gratis) tidak penuh.
#
# Pengaturan repo (Settings → Secrets and variables → Actions):
#   Variable  LEMBURIN_API_URL           wajib, mis. https://lemburin-api.onrender.com
#   Secret    ANDROID_KEYSTORE_BASE64    opsional, isi file .jks di-base64
#   Secret    ANDROID_KEYSTORE_PASSWORD  opsional
#   Secret    ANDROID_KEY_ALIAS          opsional
#   Secret    ANDROID_KEY_PASSWORD       opsional
#   Secret    GOOGLE_SERVICES_JSON       opsional, isi google-services.json dari Firebase
#                                        (mengaktifkan notifikasi di aplikasi Android)
# Tanpa keystore, yang dibuat APK debug (bisa langsung dipasang di HP untuk uji coba).
#
# Semua action memakai versi yang berjalan di Node.js 24. Runner Linux dikunci ke
# Ubuntu 24.04 supaya build tidak berubah saat ubuntu-latest pindah ke Ubuntu 26.

name: Build aplikasi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_API_URL: ${{ vars.LEMBURIN_API_URL }}

jobs:
  # Buat (atau pakai ulang) rilis untuk tag ini lebih dulu, supaya job build bisa
  # mengunggah langsung ke rilis tanpa saling berebut membuatnya.
  siapkan-rilis:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Buat rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "lemburin $GITHUB_REF_NAME" --generate-notes

  android:
    needs: siapkan-rilis
    if: ${{ !cancelled() && (needs.siapkan-rilis.result == 'success' || needs.siapkan-rilis.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4

      - name: Cek alamat backend
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Isi variable LEMBURIN_API_URL di Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: Firebase untuk notifikasi (kalau ada)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" > client/android/app/google-services.json
            echo "VITE_FCM=true" >> $GITHUB_ENV
          else
            echo "Tanpa google-services.json: notifikasi aplikasi Android dimatikan (portal tetap jalan)"
          fi

      - name: Build web (mode native) dan sinkron ke Android
        working-directory: client
        run: |
          npm ci
          echo "VITE_API_URL=$VITE_API_URL" > .env.native
          if [ "$VITE_FCM" = "true" ]; then echo "VITE_FCM=true" >> .env.native; fi
          npm run build:native
          npx cap sync android

      - name: Versi dari tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "LEMBURIN_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi
          echo "LEMBURIN_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Siapkan keystore (kalau ada)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/lemburin.jks"
            echo "LEMBURIN_KEYSTORE_FILE=$RUNNER_TEMP/lemburin.jks" >> $GITHUB_ENV
          else
            echo "Tanpa keystore: membuat APK debug"
          fi

      - name: Build APK
        working-directory: client/android
        env:
          LEMBURIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEMBURIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEMBURIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../../keluaran
          if [ -n "$LEMBURIN_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../../keluaran/lemburin-android.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../keluaran/lemburin-android.aab
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../keluaran/lemburin-android-debug.apk
          fi

      - name: Lampirkan ke rilis
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" keluaran/* -R "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: lemburin-android
          path: keluaran/*
          retention-days: 3

  desktop:
    needs: siapkan-rilis
    if: ${{ !cancelled() && (needs.siapkan-rilis.result == 'success' || needs.siapkan-rilis.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      - name: Build web (mode native)
        working-directory: client
        shell: bash
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Isi variable LEMBURIN_API_URL di Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          npm ci
          echo "VITE_API_URL=$VITE_API_URL" > .env.native
          npm run build:native

      - name: Kemas aplikasi desktop
        working-directory: desktop
        shell: bash
        env:
          # Belum ada sertifikat code signing: build tanpa tanda tangan
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi
          node scripts/salin-web.cjs
          npx electron-builder --publish never

      - name: Lampirkan ke rilis
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          berkas=(desktop/release/*.exe desktop/release/*.dmg desktop/release/*.AppImage desktop/release/*.deb)
          gh release upload "$GITHUB_REF_NAME" "${berkas[@]}" -R "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: lemburin-desktop-${{ runner.os }}
          retention-days: 3
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
